name: Radar diario · Daily radar

on:
  schedule:
    - cron: "17 5 * * *"   # 05:17 UTC ≈ 07:17 Madrid (horario de verano)
  workflow_dispatch: {}      # botón "Run workflow" para lanzarlo a mano

permissions:
  contents: write

concurrency:
  group: radar
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Tests
        run: python -m unittest discover -s tests

      - name: Generar digest · Build digest
        run: python radar.py

      - name: Publicar · Commit
        run: |
          git config user.name  "radar-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A digests data README.md feed.xml
          if git diff --cached --quiet; then
            echo "Sin cambios · No changes"
          else
            git commit -m "radar: $(date -u +%Y-%m-%d)"
            git push
          fi
